set $term ghostty
bindsym --no-warn $mod+Return exec $term

# rofi opens Terminal=true .desktop entries with whatever its -terminal flag
# says, and that flag was already expanded to 'foot'. Rebuild the launcher.
set $rofi_cmd rofi -terminal '$term'
set $menu $rofi_cmd -show combi -combi-modes drun#run -modes combi
bindsym --no-warn $mod+d exec $menu
