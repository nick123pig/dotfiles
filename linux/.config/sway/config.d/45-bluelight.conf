# Blue light filter. wlsunset ships in the Sericea base image, so this needs no
# rpm-ostree layering - unlike gammastep or wl-gammarelay-rs, which would have
# to be re-layered across every rebase.
#
# Schedule is fixed clock times rather than -l/-L coordinates on purpose: this
# repo is public, and latitude/longitude accurate enough for sunset is
# accurate enough to locate a house. If you want true solar times, put the
# -l/-L variant in 80-local-outputs.conf instead - that file is gitignored.
#
# The daemon runs as the wlsunset.service systemd user unit, not as a child of
# sway - it needs Restart=always, because wlsunset exits whenever outputs come
# and go (DPMS, suspend/resume, docking) and otherwise just dies overnight.
# The schedule lives in that unit's ExecStart, so it is defined exactly once.
#
# exec_always, not exec, so `swaymsg reload` restarts it after a manual stop;
# `systemctl start` on an already-running unit is a no-op, so reloads are safe.
exec_always $HOME/.local/bin/bluelight start
