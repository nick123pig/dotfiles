# Move resize mode off $mod+r, freeing that combo for applications.
#
# /etc/sway/config binds $mod+r to resize mode, and this directory is included
# at the END of that file, so the unbind below is parsed later and wins.
#
# The unbind is what matters: a key sway has grabbed never reaches the focused
# client at all, so a Firefox web app that wants Super+R cannot see it while
# the binding exists. There is deliberately no narrower fix - sway has no
# per-window bindings, and the keyboard-shortcuts-inhibit protocol that would
# let a single window opt out is not implemented by Firefox.
unbindsym $mod+r
bindsym $mod+Shift+r mode "resize"
