# Linux-specific kitty settings, analogue of ghostty-linux.conf.
# Included from the shared kitty.conf via globinclude kitty-${KITTY_OS}.conf.

# Ghostty linux keybinds:
#   keybind = performable:ctrl+c=copy_to_clipboard:mixed
#   keybind = ctrl+v=paste_from_clipboard
# copy_or_interrupt: copies if there is a selection, otherwise sends SIGINT.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# Ctrl+W deletes the previous whitespace-delimited word in Bash/readline,
# and works over SSH without installing custom remote key bindings.
map ctrl+backspace send_text all \x17
