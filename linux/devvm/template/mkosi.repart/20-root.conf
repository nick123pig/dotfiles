# mkosi.repart/20-root.conf — root partition.
# Label=root is deterministic: vmspawn discovers root=PARTUUID automatically,
# and `root=LABEL=root` is a valid manual override.
# Default disk is 150G (sparse: only real bytes count); `devvm new
# --disk SIZE` rewrites SizeMinBytes= here per VM.
[Partition]
Type=root
Format=xfs
Label=root
CopyFiles=/
SizeMinBytes=150G
SizeMaxBytes=150G