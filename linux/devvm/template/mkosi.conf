[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64

[Output]
Format=disk
Output=system
OutputDirectory=out

[Build]
CacheDirectory=../.cache
BuildDirectory=../.build
PackageCacheDirectory=../.cache/packages
CacheOnly=never

[Content]
Bootable=yes
Bootloader=uki
Packages=
    kernel
    systemd
    systemd-pam
    systemd-networkd
    systemd-resolved
    dbus-broker 
    systemd-boot
    openssh-server
    selinux-policy-targeted
    fedora-release 
    hostname
    glibc-langpack-en
    iproute
    iputils
    dnf5
    dnf5-plugin-automatic
    sudo
    stow
    bash
    bash-completion
    coreutils
    util-linux
    git
    @c-development
    vim
    podman-docker
    fuse-overlayfs
    slirp4netns
    shadow-utils
    python3
    pip
    findutils
    grep
    gawk
    sed
    diffutils
    ripgrep
    fd-find
    tar
    gzip
    xz
    less
    ncurses
    ncurses-term
    man-db
    curl
    wget
Locale=en_US.UTF-8
Keymap=us
Timezone=UTC
CleanPackageMetadata=no
SELinuxRelabel=yes
[Runtime]
Firmware=linux
