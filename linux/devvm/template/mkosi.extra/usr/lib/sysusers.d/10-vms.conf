# Named admin user — there is no root login (see sshd_config.d).
# Username rendered by devvm (`--user`, default "admin"); home dir is
# created by usr/lib/tmpfiles.d/10-vms.conf (systemd-sysusers only
# records the account, it does not create directories).
u admin - "VM admin" /home/admin /bin/bash
m admin wheel
