# Homes + ssh dir for the admin user (see sysusers.d/10-vms.conf).
# `d` creates/adjusts directories, `f` fixes ownership/mode of the
# authorized_keys shipped via mkosi.extra/home/<user>/.
d /home/admin 0700 admin admin -
d /home/admin/.ssh 0700 admin admin -
f /home/admin/.ssh/authorized_keys 0600 admin admin -
