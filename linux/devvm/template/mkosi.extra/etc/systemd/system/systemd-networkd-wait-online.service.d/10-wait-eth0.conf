# The guest has a single static NIC (eth0, see 10-eth0.network). Without an
# explicit interface, systemd-networkd-wait-online waits in a way that never
# completes here, so network-online.target (and everything ordered after it,
# e.g. dotfiles-sync.service) would stay queued forever. Wait for eth0 only.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --interface=eth0
